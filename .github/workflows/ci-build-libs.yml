name: Manual build static libraries

on:
  workflow_dispatch:
  push:
    branches:
      - feature/update-external-libraries-ubuntu16
      - main
      - windows

jobs:
  build-libxml2:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04-arm, macos-latest, macos-13, windows-latest ]

      fail-fast: false

    runs-on: ${{ matrix.os }}
    env:
      JOB_VAR: "job_value"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget cmake autoconf automake

      - name: Set up dependencies Macos
        if: runner.os == 'macOS'
        run: |
          brew install wget cmake autoconf automake

      - name: Set up dependencies Window
        if: runner.os == 'windows'
        run: |
          
      - name: Set OS and ARCH variables
        if: runner.os == 'Linux'
        run: |
          echo "OS='linux'" >> $GITHUB_ENV
          echo "ARCH=${{ runner.arch == 'X64' && '64' || 'arm64' }}" >> $GITHUB_ENV
        shell: bash

      - name: Set OS and ARCH variables
        if: runner.os == 'macOS'
        run: |
          echo "OS='mac'" >> $GITHUB_ENV
          echo "ARCH=${{ runner.arch == 'X64' && '64' || 'arm64' }}" >> $GITHUB_ENV
        shell: bash

      - name: Set OS and ARCH variables
        if: runner.os == 'windows'
        run: |
          echo "OS='windows'" >> $GITHUB_ENV
          echo "ARCH=${{ runner.arch == 'X64' && '64' || 'arm64' }}" >> $GITHUB_ENV

      - name: Download source
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          pushd libs/libxml
          wget -O source.tar.gz https://gitlab.gnome.org/GNOME/libxml2/-/archive/v2.13.6/libxml2-v2.13.6.tar.gz
          tar -xzf source.tar.gz
          mv libxml2-* src

      - name: Download source
        if: runner.os == 'windows'
        shell: pwsh        
        run: |
          pushd libs\libxml
          wget -O source.tar.gz https://gitlab.gnome.org/GNOME/libxml2/-/archive/v2.13.6/libxml2-v2.13.6.tar.gz
          tar -xzf source.tar.gz
          mv libxml2-* src

      - name: Build source
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cd libs/libxml/src
          mkdir -p build/output
          cd build          
          cmake -DCMAKE_INSTALL_PREFIX=$(pwd)/output -G "Unix Makefiles" .. -D LIBXML2_WITH_LZMA=OFF -D LIBXML2_WITH_ICONV=OFF -D LIBXML2_WITH_ZLIB=OFF -DBUILD_SHARED_LIBS=OFF
          make -j8
          make install
          cd ..
          mkdir -p output/libxml/$OS/$ARCH
          cp build/output/lib/libxml2.a output/libxml/$OS/$ARCH
          cp -r build/output/include/libxml2 output/libxml
          mv output/libxml/libxml2 output/libxml/include
          
      - name: Build source
        if: runner.os == 'windows'
        run: |
          cd libs\libxml\src
          mkdir build\output
          cd build          
          cmake -DCMAKE_INSTALL_PREFIX=$(pwd)/output -G "Visual Studio 17 2022" .. -D LIBXML2_WITH_LZMA=OFF -D LIBXML2_WITH_ICONV=OFF -D LIBXML2_WITH_ZLIB=OFF -DBUILD_SHARED_LIBS=OFF
          msbuild
          cd ..
          mkdir output\libxml\%OS%\%ARCH%
          copy build\output\lib\libxml2.lib output\libxml\%OS%\%ARCH%
          xcopy /S build\output\include\libxml2 output\libxml
          move output\libxml\libxml2 output\libxml\include

      - name: Save specific file
        uses: actions/upload-artifact@v4
        with:
          name: libxml2-binary-${{ env.OS }}-${{ env.ARCH }}
          path: libs/libxml/src/output


  build-freetype:
    strategy:
      matrix:
        os: [ ubuntu-20.04, ubuntu-24.04-arm, macos-latest, macos-13 ]

      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget cmake autoconf automake

      - name: Set up dependencies Macos
        if: runner.os == 'macOS'
        run: |
          brew install wget cmake autoconf automake

      - name: Set OS and ARCH variables
        if: runner.os == 'Linux'
        run: |
          echo "OS='linux'" >> $GITHUB_ENV
          echo "ARCH=${{ runner.arch == 'X64' && '64' || 'arm64' }}" >> $GITHUB_ENV
        shell: bash

      - name: Set OS and ARCH variables
        if: runner.os == 'macOS'
        run: |
          echo "OS='mac'" >> $GITHUB_ENV
          echo "ARCH=${{ runner.arch == 'X64' && '64' || 'arm64' }}" >> $GITHUB_ENV
        shell: bash

      - name: Set OS and ARCH variables
        if: runner.os == 'windows'
        run: |
          echo "OS='windows'" >> $GITHUB_ENV
          echo "ARCH=${{ runner.arch == 'X64' && '64' || 'arm64' }}" >> $GITHUB_ENV

      - name: Download source
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cd libs/freetype
          wget -O source.tar.gz https://sourceforge.net/projects/freetype/files/freetype2/2.13.3/freetype-2.13.3.tar.gz/download
          tar -zxf source.tar.gz
          mv freetype-* src

      - name: Download source
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd libs/freetype
          wget -O source.tar.gz https://sourceforge.net/projects/freetype/files/freetype2/2.13.3/freetype-2.13.3.tar.gz/download
          tar -zxf source.tar.gz
          mv freetype-* src

      - name: Build source
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          cd libs/freetype/src
          mkdir -p build/output
          cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$(pwd)/output -G "Unix Makefiles" -D FT_DISABLE_BROTLI=TRUE -D FT_DISABLE_HARFBUZZ=TRUE -D FT_DISABLE_ZLIB=TRUE -D FT_DISABLE_BZIP2=TRUE -D FT_DISABLE_PNG=TRUE
          make -j8
          make install
          cd ..          
          mkdir -p output/freetype/$OS/$ARCH
          cp build/output/lib/libfreetype.a output/freetype/$OS/$ARCH/
          cp -r build/output/include/freetype2 output/freetype/
          mv output/freetype/freetype2 output/freetype/include

      - name: Build source
        if: runner.os == 'windows'
        run: |
          cd libs/freetype/src
          mkdir -p build/output
          cd build
          cmake .. -DCMAKE_INSTALL_PREFIX=$(pwd)/output -G "Visual Studio 17 2022" -D FT_DISABLE_BROTLI=TRUE -D FT_DISABLE_HARFBUZZ=TRUE -D FT_DISABLE_ZLIB=TRUE -D FT_DISABLE_BZIP2=TRUE -D FT_DISABLE_PNG=TRUE
          make -j8
          make install
          cd ..          
          mkdir -p output/freetype/$OS/$ARCH
          cp build/output/lib/libfreetype.a output/freetype/$OS/$ARCH/
          cp -r build/output/include/freetype2 output/freetype/
          mv output/freetype/freetype2 output/freetype/include

      - name: Save specific file
        uses: actions/upload-artifact@v4
        with:
          name: freetype-binary-${{ env.OS }}-${{ env.ARCH }}
          path: libs/freetype/src/output

